name: Build Functions

on:
  push:
    branches: [main]
    paths:
      - "functions/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install faas-cli
        run: curl -sSL https://cli.openfaas.com | sudo sh

