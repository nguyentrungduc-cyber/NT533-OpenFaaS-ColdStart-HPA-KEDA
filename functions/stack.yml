version: 1.0
provider:
  name: openfaas
  gateway: http://192.168.243.10:31112

configuration:
  templates:
    - name: python3-http
      source: https://github.com/openfaas/python-flask-template
    # Bản Debian của python3-http, cùng repo template. Chỉ dùng cho fib-debian (TN2).
    - name: python3-http-debian
      source: https://github.com/openfaas/python-flask-template
    - name: node24
      source: https://github.com/openfaas/templates

functions:
  hello-py:
    lang: python3-http
    handler: ./hello-py
    image: ghcr.io/nguyentrungduc-cyber/hello-py:latest

  fibonacci:
    lang: python3-http
    handler: ./fibonacci
    image: ghcr.io/nguyentrungduc-cyber/fibonacci:latest
    # HPA tính mức dùng CPU theo phần trăm so với requests, nên function phải
    # khai báo requests thì HPA theo CPU mới kích hoạt được. fibonacci là function
    # dùng cho TN5 (so sánh HPA vs KEDA) nên bắt buộc có.
    # Con số dưới đây là mức khởi điểm, cần chốt lại với Huỳnh Qui sau khi có
    # baseline: ngưỡng HPA 50% ứng với 50m CPU.
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

  # TN2: cùng mã nguồn với fibonacci (handler ./fibonacci), chỉ khác image nền
  # (Debian slim thay vì Alpine) để so cold-start theo kích thước image.
  # requests/limits giữ y hệt fibonacci để không thêm biến nào khác.
  fib-debian:
    lang: python3-http-debian
    handler: ./fibonacci
    image: ghcr.io/nguyentrungduc-cyber/fib-debian:latest
    build_args:
      PYTHON_VERSION: "3.12"
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi

  text-sentiment:
    lang: python3-http
    handler: ./text-sentiment
    image: ghcr.io/nguyentrungduc-cyber/text-sentiment:latest

  notify:
    lang: python3-http
    handler: ./notify
    image: ghcr.io/nguyentrungduc-cyber/notify:latest

  image-resize:
    lang: python3-http
    handler: ./image-resize
    image: ghcr.io/nguyentrungduc-cyber/image-resize:latest

  data-transform:
    lang: node24
    handler: ./data-transform
    image: ghcr.io/nguyentrungduc-cyber/data-transform:latest
    environment:
      MAX_JSON_SIZE: 1mb