version: 1.0
provider:
  name: openfaas
  gateway: http://192.168.243.10:31112

configuration:
  templates:
    - name: python3-http
      source: https://github.com/openfaas/python-flask-template
    - name: node24
      source: https://github.com/openfaas/templates

functions:
  hello-py:
    lang: python3-http
    handler: ./hello-py
    image: ghcr.io/nguyentrungduc-cyber/hello-py:latest

  fibonacci:
    lang: python3-http
    handler: ./fibonacci
    image: ghcr.io/nguyentrungduc-cyber/fibonacci:latest

  text-sentiment:
    lang: python3-http
    handler: ./text-sentiment
    image: ghcr.io/nguyentrungduc-cyber/text-sentiment:latest

  notify:
    lang: python3-http
    handler: ./notify
    image: ghcr.io/nguyentrungduc-cyber/notify:latest

  image-resize:
    lang: python3-http
    handler: ./image-resize
    image: ghcr.io/nguyentrungduc-cyber/image-resize:latest

  data-transform:
    lang: node24
    handler: ./data-transform
    image: ghcr.io/nguyentrungduc-cyber/data-transform:latest
    environment:
      MAX_JSON_SIZE: 1mb