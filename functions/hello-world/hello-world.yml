version: 1.0
provider:
  name: openfaas
  # Gateway: trên master dùng 192.168.243.10:31112
  # Từ laptop thành viên (qua Tailscale): http://100.88.160.40:31112
  gateway: http://192.168.243.10:31112

# Template cần tải khi build (GitHub Actions đọc mục này)
configuration:
  templates:
    - name: python3-http
      source: https://github.com/openfaas/python-flask-template

# LUÔN chạy faas-cli từ thư mục functions/ (handler và template tính theo thư mục hiện tại):
#   cd functions
#   faas-cli deploy -f hello-world/hello-world.yml --tag sha
functions:
  hello-world:
    lang: python3-http
    handler: ./hello-world
    # Image do GitHub Actions build và đẩy lên GHCR (master không có Docker)
    image: ghcr.io/nguyentrungduc-cyber/hello-world:latest
    # KHÔNG đặt nhãn com.openfaas.scale.factor: "0": gateway CE 0.27.x từ chối giá trị 0
    # và mọi lần gọi function đều trả 404 "bad scaling factor: 0".
    # Scale-to-zero làm bằng KEDA (minReplicaCount: 0), không dùng nhãn
    # com.openfaas.scale.zero vì nhãn đó chỉ có tác dụng ở bản OpenFaaS trả phí.
    environment:
      write_timeout: 15s
      read_timeout: 15s
      exec_timeout: 10s
