# prometheus-config.yaml — Cấu hình scrape targets
# TODO (Người 4): điền đúng service name/namespace sau khi OpenFaaS
# và KEDA đã deploy thật trên cluster

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "kubernetes-nodes"
    kubernetes_sd_configs:
      - role: node

  - job_name: "openfaas-gateway"
    static_configs:
      - targets: ["gateway.openfaas.svc:8080"] # TODO: xác nhận đúng service

  - job_name: "keda-metrics"
    static_configs:
      - targets: ["keda-operator-metrics-apiserver.keda.svc:9022"] # TODO: xác nhận đúng service
