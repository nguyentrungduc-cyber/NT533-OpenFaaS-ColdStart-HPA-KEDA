# keda-scaledobject.yaml — Cấu hình KEDA scale dựa trên RPS (Prometheus trigger)
#
# Điểm khác với HPA:
#   - Trigger dựa trên request/s thực tế (RPS) thay vì CPU usage
#   - Giả thuyết cần TN5 kiểm chứng: phản ứng nhanh hơn HPA khi tải tăng đột ngột
#
# Lưu ý về cooldownPeriod và pollingInterval (theo tài liệu ScaledObject của KEDA):
#   KEDA chỉ tự quyết việc chuyển 0 <-> 1 pod. Từ 1 đến N pod, việc tăng/giảm do HPA
#   mà KEDA tạo ra (keda-hpa-<tên>) đảm nhận. Vì minReplicaCount = 1 nên:
#   - cooldownPeriod KHÔNG có tác dụng (nó chỉ áp dụng khi scale về 0).
#   - Giảm pod theo stabilization window mặc định của HPA: 300 giây, y như HPA thuần.
#     Muốn đổi thì đặt advanced.horizontalPodAutoscalerConfig.behavior.scaleDown,
#     và nếu đổi thì phải đổi giống hệt cho HPA thuần để so sánh công bằng.
#   - HPA hỏi metric theo chu kỳ của kube-controller-manager (mặc định 15 giây),
#     nên pollingInterval nhỏ hơn không làm KEDA phản ứng nhanh hơn ở dải 1..N.
#
# minReplicaCount PHẢI >= 1 và maxReplicaCount PHẢI <= 5.
# Trên OpenFaaS CE không dùng được scale-to-zero: faas-netes giữ mức sàn 1 pod và
# giằng co với KEDA nếu đặt minReplicaCount: 0 (có lúc không pod nào sẵn sàng phục vụ).
# Bằng chứng: ../../load-testing/results/scale-to-zero-test.md
#
# Yêu cầu:
#   - KEDA đã cài trên cluster (Helm chart kedacore/keda, namespace keda)
#   - Prometheus đang scrape OpenFaaS gateway metrics
#   - Prometheus service: prometheus.openfaas.svc.cluster.local:9090
#
# KHÔNG dùng cùng lúc với HPA cho cùng một function: KEDA tự tạo HPA riêng,
# hai bên sẽ tranh nhau điều khiển số pod. Gỡ HPA trước:
#   kubectl delete -f ../hpa/hpa-config.yaml --ignore-not-found
#
# Trước khi apply, kiểm tra giá trị nhãn function_name thật trong Prometheus
# (có đuôi namespace; của fibonacci đã đo: fibonacci.openfaas-fn):
#   kubectl -n openfaas port-forward svc/prometheus 9090:9090 &
#   curl -s 'http://localhost:9090/api/v1/query?query=gateway_function_invocation_total' | head -c 800
#
# Deploy:
#   kubectl apply -f keda-scaledobject.yaml
#
# Kiểm tra:
#   kubectl get scaledobject -n openfaas-fn
#   kubectl describe scaledobject fibonacci-keda -n openfaas-fn
#
# Trước khi so sánh HPA với KEDA, phải tắt bộ co giãn có sẵn của bản CE, nếu không
# sẽ có ba cơ chế cùng điều khiển số pod:
#   helm upgrade openfaas openfaas/openfaas -n openfaas --reuse-values \
#     --set alertmanager.create=false

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: fibonacci-keda
  namespace: openfaas-fn
spec:
  scaleTargetRef:
    name: fibonacci             # khớp với tên Deployment OpenFaaS tạo ra
  minReplicaCount: 1            # bản CE không cho về 0, xem chú thích đầu file
  maxReplicaCount: 5
  cooldownPeriod: 30            # chỉ có tác dụng khi scale về 0; với min=1 thì HPA lo việc giảm pod, mặc định chờ 300 giây
  pollingInterval: 15           # chu kỳ KEDA poll Prometheus; ở dải 1..N, HPA vẫn hỏi metric mỗi 15 giây
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.openfaas.svc.cluster.local:9090
        # Đếm số request/s tới function fibonacci trong 1 phút gần nhất
        query: >
          sum(
            rate(
              gateway_function_invocation_total{function_name="fibonacci.openfaas-fn"}[1m]
            )
          )
        # Số req/s mỗi pod nên gánh; KEDA tăng pod khi tổng RPS / số pod vượt ngưỡng này.
        # 24 = khoảng 60% của C = 40 req/s (docx: 50-70% của C), cũng là mức HPA 50% của
        # requests 350m ứng với (xem ../README.md). Phải khớp với HPA để so sánh công bằng.
        threshold: "24"
        # Ngưỡng bật 0 -> 1 pod; không có tác dụng vì minReplicaCount = 1
        activationThreshold: "0"
