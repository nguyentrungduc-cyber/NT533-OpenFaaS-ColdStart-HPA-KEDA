# keda-scaledobject.yaml — Cấu hình KEDA scale dựa trên RPS (Prometheus trigger)
#
# Điểm khác với HPA:
#   - Trigger dựa trên request/s thực tế (RPS) thay vì CPU usage
#   - Phản ứng nhanh hơn HPA khi tải tăng đột ngột
#
# minReplicaCount PHẢI >= 1 và maxReplicaCount PHẢI <= 5.
# Trên OpenFaaS CE không dùng được scale-to-zero: faas-netes giữ mức sàn 1 pod và
# giằng co với KEDA nếu đặt minReplicaCount: 0 (có lúc không pod nào sẵn sàng phục vụ).
# Bằng chứng: ../../load-testing/results/scale-to-zero-test.md
#
# Yêu cầu:
#   - KEDA đã cài trên cluster (Helm chart kedacore/keda, namespace keda)
#   - Prometheus đang scrape OpenFaaS gateway metrics
#   - Prometheus service: prometheus.openfaas.svc.cluster.local:9090
#
# KHÔNG dùng cùng lúc với HPA cho cùng một function: KEDA tự tạo HPA riêng,
# hai bên sẽ tranh nhau điều khiển số pod. Gỡ HPA trước:
#   kubectl delete -f ../hpa/hpa-config.yaml --ignore-not-found
#
# Trước khi apply, kiểm tra giá trị nhãn function_name thật trong Prometheus
# (thường có đuôi namespace, ví dụ hello-world.openfaas-fn):
#   kubectl -n openfaas port-forward svc/prometheus 9090:9090 &
#   curl -s 'http://localhost:9090/api/v1/query?query=gateway_function_invocation_total' | head -c 800
#
# Deploy:
#   kubectl apply -f keda-scaledobject.yaml
#
# Kiểm tra:
#   kubectl get scaledobject -n openfaas-fn
#   kubectl describe scaledobject hello-world-keda -n openfaas-fn
#
# Trước khi so sánh HPA với KEDA, phải tắt bộ co giãn có sẵn của bản CE, nếu không
# sẽ có ba cơ chế cùng điều khiển số pod:
#   helm upgrade openfaas openfaas/openfaas -n openfaas --reuse-values \
#     --set alertmanager.create=false

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: hello-world-keda
  namespace: openfaas-fn
spec:
  scaleTargetRef:
    name: hello-world           # khớp với tên Deployment OpenFaaS tạo ra
  minReplicaCount: 1            # bản CE không cho về 0, xem chú thích đầu file
  maxReplicaCount: 5
  cooldownPeriod: 30            # giây chờ trước khi giảm pod
  pollingInterval: 15           # giây giữa các lần KEDA poll Prometheus
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.openfaas.svc.cluster.local:9090
        # Đếm số request/s tới function hello-world trong 1 phút gần nhất
        query: >
          sum(
            rate(
              gateway_function_invocation_total{function_name="hello-world.openfaas-fn"}[1m]
            )
          )
        # Scale up khi RPS vượt ngưỡng này
        # Tinh chỉnh sau khi có số liệu baseline từ load test
        threshold: "10"
        # Có request (giá trị > 0) là bật từ 0 lên 1 pod
        activationThreshold: "0"
